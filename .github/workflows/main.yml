name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Theos Development Environment
      run: |
        bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
        echo "THEOS=~/theos" >> $GITHUB_ENV
        
    - name: Download iOS 16.5 SDK
      run: |
        git clone https://github.com/theos/sdks.git ~/theos/sdks
        
    - name: Compile Tweak Package
      run: |
        export THEOS=~/theos
        make package THEOS_PACKAGE_SCHEME=rootless

    - name: Upload Finished Deb Package
      uses: actions/upload-artifact@v4
      with:
        name: ScreenFlash-Rootless-Deb
        path: packages/*.deb
